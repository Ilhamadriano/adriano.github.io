<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>@ilham.pesstore</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background-color: #0a0a0a;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      min-height: 100vh;
    }

    .container {
      text-align: center;
      max-width: 400px;
      width: 100%;
      padding: 20px;
    }

    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 15px;
      border: 3px solid cyan;
      box-shadow: 0 0 15px cyan;
    }

    h1 {
      font-size: 22px;
      margin: 10px 0;
      color: cyan;
      text-shadow: 0 0 10px cyan;
    }

    p.bio {
      font-size: 14px;
      margin-bottom: 25px;
      color: #aaa;
    }

    .link-btn {
      display: block;
      background: transparent;
      color: cyan;
      border: 2px solid cyan;
      margin: 12px 0;
      padding: 12px;
      border-radius: 30px;
      font-size: 16px;
      text-decoration: none;
      box-shadow: 0 0 10px cyan;
      transition: all 0.3s ease-in-out;
      position: relative;
      overflow: hidden;
    }

    .link-btn:hover {
      background: cyan;
      color: #0a0a0a;
      box-shadow: 0 0 20px cyan;
      transform: translateY(-3px);
    }

    .link-btn span {
      margin-right: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="pp.jpg" alt="Profile" class="profile-img">
    <h1>@ilham.pesstore</h1>
    <p class="bio">Selamat datang di halaman resmi Ilham Pesstore</p>

    <!-- Tombol Grup Mabar -->
    <a class="link-btn" href="https://chat.whatsapp.com/LDlzWenVd8q8YP3Dl184nO?mode=ac_t" target="_blank">
      <span>🎮</span> GRUP MABAR/NGOBROL² SEPUTAR EFOOTBALL
    </a>
  </div>
</body>
</html>
